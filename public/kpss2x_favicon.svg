<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- 3D Physical Push Button Outer Shape (Dark Bottom Rim #1899d6) -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#1899d6" filter="url(#drop-shadow)" />
  
  <!-- Main Button Surface (#1cb0f6) -->
  <rect x="32" y="32" width="448" height="412" rx="112" fill="#1cb0f6" />

  <!-- Inner Highlight Rim -->
  <rect x="40" y="40" width="432" height="396" rx="104" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25" />

  <!-- Tight, Compact & Bold Typographic Group -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Poppins', 'Segoe UI', sans-serif" font-weight="900" text-anchor="middle">
    <!-- Top Line: KPSS -->
    <text x="256" y="195" fill="#ffffff" font-size="105" letter-spacing="-1">KPSS</text>

    <!-- Bottom Line: 2X (Tightly paired together) -->
    <text x="256" y="375" font-size="200" letter-spacing="-6">
      <tspan fill="#ffffff">2</tspan><tspan fill="#58cc02">X</tspan>
    </text>
  </g>
</svg>
